name: Run Simulation

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Disable GUI (headless runner has no display)
        run: |
          sed -i 's/^TRAINING_GUI = True/TRAINING_GUI = False/' config/run.py
          sed -i 's/^EVALUATION_GUI = True/EVALUATION_GUI = False/' config/run.py

      - name: Run simulation
        run: python applications/MainApplication.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-output
          path: output/
          retention-days: 14
